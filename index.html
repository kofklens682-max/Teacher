  <script>
    // Works offline: the service worker keeps the app on the phone (not on this computer's test server).
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadController) location.reload(); });
    }
  </script>
  <script>
    // Self-repair: if nothing was drawn after 6 seconds (a broken saved copy of the app files), clear that copy once and reload. Your data is not touched.
    setTimeout(function () {
      var r = document.getElementById("tp"); if (r && r.children.length) return;
      try { if (sessionStorage.getItem("selfheal")) return; sessionStorage.setItem("selfheal", "1"); } catch (e) { return; }
      (async function () {
        try { var reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.unregister(); } catch (e) { /* none */ }
        try { var ks = await caches.keys(); for (var k of ks) if (k.indexOf("teacher-") === 0 && k !== "teacher-media") await caches.delete(k); } catch (e) { /* none */ }
        location.replace(location.pathname + "?fresh=" + Date.now());
      })();
    }, 6000);
  </script>
