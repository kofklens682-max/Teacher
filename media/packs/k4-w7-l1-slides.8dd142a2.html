const all=[["t"],...S,["end"]];let i=0,st={};

const $=id=>document.getElementById(id);
function ans(a){return st.shown?`<div class="ans">${e(a)}</div>`:`<button class="show" data-show>Show the answer</button>`}
function draw(){const s=all[i],c=$("card");let h="";
 if(s[0]==="t")h=`<div class="title"><div class="k">${e(EYE)}</div><div class="q">${e(TITLE)}</div></div><div class="why">${S.length} slides · press → to start</div>`;
 else if(s[0]==="end")h=`<div class="title"><div class="big">&#127881;</div><div class="q">Well done!</div></div><div class="why">That's all for today's big screen.</div>`;
 else if(s[0]==="c"){const p=st.sel!==undefined;h=`<div class="k">Choose</div><div class="q">${e(s[1])}</div><div class="opts">${s[2].map((o,j)=>`<button class="opt${p&&j===s[3]?" ok":p&&st.sel===j?" no":""}" data-pick="${j}">${e(o)}</button>`).join("")}</div>`+(p?`<div class="ans ${st.sel===s[3]?"":"bad"}">${st.sel===s[3]?"Yes!":"Not this one."}</div><div class="why">${e(s[4]||"")}</div>`:"")}
 else if(s[0]==="r")h=`<div class="k">${/^Find the mistake/.test(s[1])?"Fix the mistake":/^Put the words/.test(s[1])?"Build the sentence":"Say it"}</div><div class="q">${e(s[1].replace(/^(Find the mistake|Put the words in order): /,""))}</div>${ans(s[2])}`;
 else if(s[0]==="p")h=`<img class="one" src="${s[1]}" alt=""><div class="q">${e(s[2])}</div>${ans(s[3])}`;
 else if(s[0]==="v")h=`<div class="two"><img src="${s[1]}" alt=""><img src="${s[2]}" alt=""></div><div class="q">Compare them: ${e(s[3])}</div>${ans(s[4])}`;
 else if(s[0]==="b"){st.line=st.line||[];h=`<div class="k">Build the sentence</div><div class="ru">${e(s[1])}</div><div class="line">${st.line.map(j=>e(s[2][j])).join(" ")}${st.line.length===s[2].length?e(s[4]):""}</div><div class="opts">${s[2].map((w,j)=>`<button class="chip${st.line.includes(j)?" used":""}" data-chip="${j}">${e(w)}</button>`).join("")}</div>`+(st.shown?`<div class="ans">${e(s[3])}</div>`:`<div class="opts"><button class="opt" data-undo>Undo</button><button class="show" data-show>Show the answer</button></div>`)}

function go(d){const n=Math.max(0,Math.min(all.length-1,i+d));if(n!==i){i=n;st={};draw()}}
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;const d=b.dataset,s=all[i];

 else if(d.chip!==undefined){st.line=(st.line||[]).concat(+d.chip);draw()}else if(d.undo!==undefined){(st.line||[]).pop();draw()}});

 else if(ev.key==="Enter"){st.shown=true;draw()}else if(ev.key==="f"||ev.key==="F")full()});

draw();
