<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 15 · Well done! · big screen</title><style>
:root{--a:#3D5AFE;--a2:#7B61FF;--ok:#12B76A;--no:#F04438;--bg:#F2F3F8;--card:#fff;--t:#0E1325;--t2:rgba(14,19,37,.6)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--t);font:400 16px/1.35 "Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:2vw;padding:1.6vh 3vw;font-weight:700;font-size:clamp(14px,1.6vw,26px);color:var(--t2)}
.top .bar{flex:1;height:1.1vh;min-height:6px;border-radius:9px;background:rgba(14,19,37,.08);overflow:hidden}.top .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .3s}
.stage{position:fixed;inset:8vh 4vw 13vh;display:grid;place-items:center}
.card{width:100%;height:100%;background:var(--card);border-radius:3vw;box-shadow:0 2vh 6vh rgba(14,19,37,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:4vh 5vw;text-align:center;animation:in .35s cubic-bezier(.2,.8,.25,1)}
@keyframes in{from{opacity:0;transform:translateY(2vh) scale(.98)}to{opacity:1;transform:none}}
.k{font-size:clamp(14px,1.5vw,24px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a)}
.q{font-size:clamp(26px,4.2vw,76px);font-weight:800;letter-spacing:-.02em;line-height:1.15;max-width:90%}
.ru{font-size:clamp(18px,2.4vw,40px);color:var(--t2);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:2vw;justify-content:center}
.opt,.chip{font:inherit;cursor:pointer;border:0;border-radius:2vw;padding:2vh 3vw;font-size:clamp(22px,3vw,56px);font-weight:800;background:#EEF0FF;color:var(--a);transition:transform .15s}
.opt:hover,.chip:hover{transform:translateY(-2px)}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.chip{font-size:clamp(20px,2.6vw,48px);padding:1.6vh 2.2vw;background:#FFF4E5;color:#B05F00}.chip.used{opacity:.2;pointer-events:none}
.line{min-height:9vh;width:90%;border-bottom:.5vh dashed rgba(14,19,37,.18);font-size:clamp(24px,3.2vw,60px);font-weight:800;display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vw;align-items:flex-end;padding-bottom:1vh}
.ans{font-size:clamp(26px,3.8vw,68px);font-weight:800;color:var(--ok)}.ans.bad{color:var(--no)}.why{font-size:clamp(18px,2vw,34px);color:var(--t2);font-weight:600}
.show{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:1.6vh 3.4vw;font-size:clamp(18px,2vw,34px);font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}
img.one{max-height:38vh;max-width:60%;border-radius:2vw;object-fit:contain}.two{display:flex;gap:3vw}.two img{max-height:36vh;max-width:38vw;border-radius:2vw;object-fit:contain}
.nav{position:fixed;left:0;right:0;bottom:2.5vh;display:flex;justify-content:center;gap:2vw}
.nav button{font:inherit;cursor:pointer;border:0;border-radius:99px;padding:1.6vh 3vw;font-size:clamp(16px,1.8vw,30px);font-weight:800;background:var(--card);color:var(--t);box-shadow:0 1vh 3vh rgba(14,19,37,.1)}
.nav button.next{background:var(--t);color:#fff}.nav button:disabled{opacity:.3}
.hint{position:fixed;right:3vw;bottom:3vh;font-size:clamp(11px,1vw,16px);color:var(--t2)}
.panels{display:flex;gap:2.5vw;justify-content:center;align-items:stretch;width:100%}.pan{flex:1;max-width:44vw;background:#F6F7FB;border-radius:2vw;padding:2vh 2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;animation:in .35s}
.figs{display:flex;gap:1.4vw;align-items:flex-end}.figs figure{display:flex;flex-direction:column;align-items:center;gap:.6vh}.figs img{height:31vh;max-width:16vw;object-fit:contain}.one .figs img{height:36vh}
.figs figcaption{font-weight:800;font-size:clamp(18px,2.3vw,42px);color:var(--a)}.props{font-size:clamp(26px,3.6vw,66px);line-height:1}.say{font-size:clamp(22px,2.9vw,54px);font-weight:700;line-height:1.2}
.tag{border-radius:99px;padding:.6vh 1.6vw;font-weight:800;font-size:clamp(12px,1.3vw,22px);letter-spacing:.08em;color:#fff;background:#12B76A}.tag.past{background:#3D5AFE}.tag.fut{background:#F79009}.tag.hab{background:#8E3BD9}
b.gm{color:#E5484D;background:#FFF0F0;border-radius:.6vw;padding:0 .4vw}.lines{display:flex;flex-direction:column;gap:2.2vh}.lines div{font-size:clamp(26px,3.8vw,70px);font-weight:800}
table.rule{border-collapse:collapse;font-size:clamp(18px,2.3vw,42px);width:90%}table.rule td{padding:1.4vh 1.4vw;border-bottom:.3vh solid rgba(14,19,37,.08);text-align:left}table.rule td:first-child{font-weight:800;color:var(--a);white-space:nowrap}table.rule td:last-child{font-style:italic;color:var(--t2)}
.title .q{font-size:clamp(32px,5.4vw,96px)}.title .big{font-size:clamp(60px,9vw,160px)}
.part{border-radius:99px;padding:.5vh 1.4vw;color:#fff;background:var(--a);font-size:clamp(12px,1.3vw,22px)}.part.ru{background:#E5484D}.part.words{background:#8E3BD9}.part.ex{background:#0FA37F}.part:empty{display:none}
img.hero1{height:40vh;object-fit:contain}
.scene{display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:center;width:100%;height:100%;text-align:left}
.hero{display:flex;flex-direction:column;align-items:center;gap:1vh;position:relative}.hero .im{position:relative;height:44vh;width:20vw}.hero img{position:absolute;inset:0;height:100%;width:100%;object-fit:contain;transition:opacity .8s}
.hero img.b{opacity:0}.scene.changed .hero img.b{opacity:1}.scene.changed .hero img.a.go{opacity:0}.hero b{font-size:clamp(18px,2.4vw,44px);color:var(--a)}
.world{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2.4vh}.pics{position:relative;height:38vh}
.pic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;border-radius:2.4vw;transition:all .9s cubic-bezier(.32,.72,0,1)}
.pic .em{font-size:var(--fs,11vw);line-height:1.05;letter-spacing:.05em;text-align:center;transition:all .9s cubic-bezier(.32,.72,0,1)}
.pic .tg{border-radius:99px;padding:.6vh 1.6vw;font-weight:800;font-size:clamp(12px,1.4vw,24px);letter-spacing:.08em;color:#fff}
.pic.before{background:#FBF4EA}.pic.before .tg{background:#9A6B3F}.pic.after{background:#EAFBF2;opacity:0;transform:scale(.6) translateX(20%)}.pic.after .tg{background:#12B76A}
.scene.changed .pic.before{inset:8% 67% 8% 0;filter:saturate(.6);opacity:.85}.scene.changed .pic.before .em{font-size:var(--fs2,4.6vw)}.scene.changed .pic.after{opacity:1;transform:none;inset:0 0 0 36%}
.txt{display:flex;flex-direction:column;gap:1.6vh}.txt .t1{font-size:clamp(22px,3vw,56px);font-weight:700;line-height:1.2;transition:all .6s}
.txt .t2{font-size:clamp(24px,3.3vw,62px);font-weight:800;line-height:1.2;opacity:0;transform:translateY(2vh);transition:all .6s .35s}
.scene.changed .t1{font-size:clamp(16px,2vw,36px);color:var(--t2)}.scene.changed .t2{opacity:1;transform:none}.tapnext{font-size:clamp(14px,1.5vw,24px);color:var(--t2);font-weight:700}
table.words{border-collapse:collapse;font-size:clamp(17px,2.2vw,40px);width:94%}table.words td,table.words th{padding:1.1vh 1.3vw;border-bottom:.3vh solid rgba(14,19,37,.08);text-align:left}
table.words th{font-size:clamp(12px,1.3vw,22px);letter-spacing:.08em;text-transform:uppercase;color:var(--t2)}table.words td:first-child{font-weight:800;color:#E5484D}table.words td:nth-child(2){font-weight:700}table.words td:nth-child(3){color:var(--t2);font-size:.8em}
</style></head><body>
